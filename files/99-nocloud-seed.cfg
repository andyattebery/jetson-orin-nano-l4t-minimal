# Installed by scripts/build.sh as /etc/cloud/cloud.cfg.d/99-nocloud-seed.cfg.
#
# NVIDIA's nvidia-l4t-configs package ships 99-disable-cloud-init.cfg. Its datasource_list:
# [None] runs cloud-init with no data and has it disable itself on the first boot. cloud-init
# merges cloud.cfg.d with the lexically last file winning a key, and this name sorts after
# NVIDIA's, so cloud-init reads the card's CIDATA volume (NoCloud). With no seed there, NVIDIA's
# None behaviour applies unchanged.
datasource_list: [NoCloud, None]
