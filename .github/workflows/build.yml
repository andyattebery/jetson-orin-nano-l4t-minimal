# Builds the SD card image and publishes it as a GitHub release (README.md). Runs when what the
# image is built from changes on main, or by hand from the Actions tab.
name: Build image

on:
  push:
    branches: [main]
    paths:
      - versions.env
      - scripts/**
      - files/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rootfs:
    # Native arm64: the root filesystem is about 990 arm64 packages, which take a long time to
    # install under qemu on an x86 runner. Run 37148236561 spent over 38 minutes on it.
    runs-on: ubuntu-24.04-arm
    # GitHub's limit for a job on its runners.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Build the root filesystem
        run: |
          df -h /
          mkdir -p "$RUNNER_TEMP/work"
          sudo scripts/build.sh rootfs --work-dir "$RUNNER_TEMP/work" --out out

      # Passed through the cache, not an artifact: artifacts count against the account's storage
      # quota, which the tarball can exceed. The cache allows 10 GB per repository and drops
      # entries unused for 7 days.
      - name: Hand the root filesystem to the image job
        uses: actions/cache/save@v6
        with:
          path: out
          key: rootfs-${{ github.run_id }}

  image:
    needs: rootfs
    # NVIDIA's flashing tools are x86 binaries.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      # The runner has 14 GB of SSD, and the image stage needs 30 GiB free.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /

      - name: Get the root filesystem
        uses: actions/cache/restore@v6
        with:
          path: out
          key: rootfs-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Build the image
        run: |
          . ./versions.env
          mkdir -p "$RUNNER_TEMP/work"
          sudo scripts/build.sh image --rootfs-tar "out/$ROOTFS_FLAVOR-$UBUNTU_CODENAME-R$L4T_VERSION-rootfs.tbz2" \
            --work-dir "$RUNNER_TEMP/work" --out "$RUNNER_TEMP/out"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./versions.env
          image="$RUNNER_TEMP/out/$BOARD_CONFIG-R$L4T_VERSION.img.xz"
          sha="$(cut -d ' ' -f 1 "$image.sha256")"
          notes="SD card image for the Jetson Orin Nano Developer Kit module (P3767-0005), Jetson Linux R$L4T_VERSION, $BOARD_CONFIG.

          sha256: $sha
          Built from $GITHUB_SHA.

          NVIDIA's software in this image is distributed under the attached Tegra Software License Agreement."
          gh release create "R$L4T_VERSION-$GITHUB_RUN_NUMBER" --target "$GITHUB_SHA" \
            --title "R$L4T_VERSION $BOARD_CONFIG (build $GITHUB_RUN_NUMBER)" --notes "$notes" \
            "$image" "$image.sha256" "$RUNNER_TEMP/out/Tegra_Software_License_Agreement-Tegra-Linux.txt"
